<!DOCTYPE html>
<html>
<head>
    <title>Manage Students</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar">
    <div class="logo">🎓 SIS</div>
    <ul class="nav-links">
        <li><a href="admin-dashboard.html">Dashboard</a></li>
        <li><a href="manage-courses.html">Courses</a></li>
        <li><a href="manage-results.html">Results</a></li>
    </ul>
</nav>

<!-- TITLE -->
<h2 class="title">Manage Students</h2>

<!-- FORM BOX -->
<div class="admin-form">

    <input type="text" id="roll" placeholder="Roll No">
    <input type="text" id="name" placeholder="Student Name">
    <input type="text" id="father" placeholder="Father Name">
    <input type="text" id="course" placeholder="Course">
    <input type="password" id="password" placeholder="Password">

    <input type="number" id="math" placeholder="Math Marks (Out of 100)">
    <input type="number" id="cs" placeholder="Computer Science Marks (Out of 100)">
    <input type="number" id="prog" placeholder="Programming Marks (Out of 100)">

    <button onclick="addStudent()">Add Student</button>

</div>

<script src="script.js"></script>

</body>
</html>
