<!DOCTYPE html>
<html>

<head>
<title>Manage Results</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h2>Manage Student Results</h2>

<div class="form-box">

<input type="text" id="roll" placeholder="Roll No">
<br><br>

<input type="text" id="name" placeholder="Student Name">
<br><br>

<input type="number" id="maths" placeholder="Maths Marks (Out of 100)">
<br><br>

<input type="number" id="cs" placeholder="Computer Science Marks (Out of 100)">
<br><br>

<input type="number" id="pl" placeholder="Programming Language Marks (Out of 100)">
<br><br>

<button onclick="addResult()">Add Result</button>

</div>

<br><br>

<h3>Results List</h3>

<table border="1" id="resultTable">

<tr>
<th>Roll No</th>
<th>Name</th>
<th>Maths</th>
<th>Computer Science</th>
<th>Programming Language</th>
</tr>

</table>

<script src="script.js"></script>

</body>
</html>
