<!DOCTYPE html>
<html>

<head>
    <title>Manage Results</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar">
    <div class="logo">🎓 SIS</div>
    <ul class="nav-links">
        <li><a href="admin-dashboard.html">Dashboard</a></li>
        <li><a href="manage-students.html">Students</a></li>
        <li><a href="manage-courses.html">Courses</a></li>
    </ul>
</nav>

<!-- TITLE -->
<h2 class="title">Manage Student Results</h2>

<!-- FORM BOX -->
<div class="admin-form">

    <input type="text" id="roll" placeholder="Roll No">
    <input type="text" id="name" placeholder="Student Name">

    <input type="number" id="math" placeholder="Maths Marks (Out of 100)">
    <input type="number" id="cs" placeholder="Computer Science Marks (Out of 100)">
    <input type="number" id="prog" placeholder="Programming Language Marks (Out of 100)">

    <button onclick="addResult()">Add Result</button>

</div>

<!-- TABLE BOX -->
<div class="admin-form">

    <h3>Results List</h3>

    <table id="resultTable">

        <tr>
            <th>Roll No</th>
            <th>Name</th>
            <th>Maths</th>
            <th>Computer Science</th>
            <th>Programming</th>
        </tr>

    </table>

</div>

<script src="script.js"></script>

</body>
</html>
