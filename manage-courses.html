<!DOCTYPE html>
<html>
<head>
    <title>Manage Courses</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar">
    <div class="logo">🎓 SIS</div>
    <ul class="nav-links">
        <li><a href="admin-dashboard.html">Dashboard</a></li>
        <li><a href="manage-students.html">Students</a></li>
        <li><a href="manage-results.html">Results</a></li>
    </ul>
</nav>

<!-- TITLE -->
<h2 class="title">Manage Courses</h2>

<!-- FORM BOX -->
<div class="admin-form">

    <input type="text" id="courseName" placeholder="Course Name">
    <input type="text" id="courseCode" placeholder="Course Code">
    <input type="text" id="teacherName" placeholder="Teacher Name">
    <input type="text" id="duration" placeholder="Duration">

    <button onclick="addCourse()">Add Course</button>

</div>

<!-- TABLE BOX -->
<div class="admin-form">

    <h3>Courses List</h3>

    <table id="courseTable">

        <tr>
            <th>Course Name</th>
            <th>Course Code</th>
            <th>Teacher</th>
            <th>Duration</th>
        </tr>

    </table>

</div>

<script src="script.js"></script>

</body>
</html>
